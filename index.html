<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你藏我找</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // 全局错误收集（调试用）
  window.__errors = [];
  window.addEventListener('error', e => window.__errors.push((e.message || '?') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => window.__errors.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)));
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
  <!-- 3D 画布容器 -->
  <div id="app"></div>

  <!-- HUD（游戏内界面层） -->
  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="interact-prompt" class="hidden"></div>
    <div id="timer" class="hidden">02:00</div>
    <div id="hint-chip" class="hidden"></div>
    <div id="role-banner" class="hidden"></div>
    <div id="found-counter" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <button id="btn-exit" title="Esc 退出本局">Esc 退出本局</button>
  </div>

  <!-- 藏家放置面板（选择槽位） -->
  <div id="slot-panel" class="hidden"></div>

  <!-- 底部操作提示条（按阶段显示按键与规则） -->
  <div id="help-bar" class="hidden"></div>

  <!-- 全屏遮罩层：主菜单 / 传递设备 / 结算 -->
  <div id="screen-menu" class="screen">
    <div class="screen-card">
      <h1>你藏我找</h1>
      <p class="subtitle">一人在别墅里藏东西，另一人限时搜出来</p>
      <div class="menu-options">
        <label>回合数
          <span class="opt-row">
            <select id="opt-rounds">
              <option value="1" selected>1</option>
              <option value="3">3</option>
              <option value="5">5</option>
              <option value="custom">自定义</option>
            </select>
            <input type="number" id="opt-rounds-custom" class="custom-input hidden"
                   min="1" max="20" step="1" value="7" placeholder="1-20">
          </span>
        </label>
        <label>藏匿件数
          <span class="opt-row">
            <select id="opt-hidecount">
              <option value="1" selected>1 件</option>
              <option value="2">2 件</option>
              <option value="3">3 件</option>
              <option value="custom">自定义</option>
            </select>
            <input type="number" id="opt-hidecount-custom" class="custom-input hidden"
                   min="1" max="8" step="1" value="5" placeholder="1-8">
          </span>
        </label>
        <label>搜索时间
          <select id="opt-time">
            <option value="120">2 分钟</option>
            <option value="180">3 分钟</option>
            <option value="300">5 分钟</option>
            <option value="0" selected>不限时间</option>
          </select>
        </label>
        <label>距离提示
          <select id="opt-hints">
            <option value="on" selected>开启（冷热提示）</option>
            <option value="off">关闭（硬核模式）</option>
          </select>
        </label>
      </div>
      <button id="btn-start" class="btn-primary">开始游戏</button>
      <p class="help-text">
        【藏家】瞄准家具按 <b>E</b> 选位置，再按物品序号藏入；瞄准书本按 <b>E</b> 可直接打开书藏进书页间<br>
        【找家】WASD 移动 / 点击画面锁定鼠标转视角 / Shift 跑 / <b>E</b> 开门·抽屉·书本·拿取（抽屉对准把手拉开，同时只开一个，<b>Q</b> 关上）· 走楼梯上二楼<br>
        庭院（长椅/信箱/花坛）和全屋 40+ 藏点都可藏 · 按 <b>Esc</b> 或点右上角按钮退出本局
      </p>
    </div>
  </div>

  <div id="screen-cover" class="screen hidden">
    <div class="screen-card">
      <h1>请把电脑交给"找"的玩家</h1>
      <p class="subtitle">藏匿已完成，搜索即将开始</p>
      <p id="cover-count" class="subtitle"></p>
      <button id="btn-cover-continue" class="btn-primary">我是找家，开始搜索！</button>
    </div>
  </div>

  <div id="screen-result" class="screen hidden">
    <div class="screen-card">
      <h1 id="result-title">找到了！</h1>
      <p id="result-detail" class="subtitle"></p>
      <p id="result-score" class="score"></p>
      <button id="btn-next-round" class="btn-primary">下一回合</button>
    </div>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="screen"><div class="screen-card"><h1>加载游戏中......</h1></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
